<link rel="icon" type="image/png" sizes="32x32" href="assets/fati.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/fati.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/fati.png">

  <!-- Préchargement des polices -->
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Bootstrap CSS (version minimisée) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Tailwind CSS (version CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Configuration Tailwind personnalisée -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#0D5BFF',
            'primary-light': '#4A8DFF',
            'primary-dark': '#021B5B',
          }
        }
      }
    }
  </script>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" defer></script>
  
  <!-- AOS Animation Library JS -->
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js" defer></script>
  
</head>
<body>
  <app-root></app-root>
  
  <!-- Script d'initialisation des animations -->
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      if (typeof AOS !== 'undefined') {
        AOS.init({
          duration: 800,
          once: true,
          offset: 100
        });
      }
    });
  </script>
</body>
